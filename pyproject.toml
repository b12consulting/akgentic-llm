[project]
name = "akgentic-llm"
version = "2.0.2"
description = "LLM integration layer for Akgentic agent systems"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [
    { name = "gpiroux", email = "geoffroy.piroux@weareyuma.com" }
]
keywords = ["llm", "agents", "ai", "pydantic-ai", "react"]

dependencies = [
    # Ceilings pinned to a reproduced upstream break, NOT precautionary caps. The LLM SDK ecosystem
    # is migrating from encode's httpx to httpx2 (github.com/pydantic/httpx2), and a client of the
    # wrong stack is rejected at RUNTIME, not just by a type checker:
    #   TypeError: Invalid `http_client` argument; Expected an instance of `httpx2.AsyncClient`
    # Boundaries verified against PyPI: pydantic-ai 2.32.0, anthropic 1.0.0, openai 3.0.
    # anthropic and openai must be bounded HERE even though they arrive transitively, because
    # pydantic-ai declares them without ceilings (anthropic>=0.108.0), so capping pydantic-ai alone
    # still resolves the migrated majors.
    # mistralai and google-genai have NOT migrated yet; they will need the same treatment when they
    # do. See decisions/adr-020 — this is a holding action, not a resting state.
    "pydantic-ai[mistral]>=2,<2.32",
    "anthropic<1",
    "openai<3",
    # NEVER cap this: genai-prices ships the price table itself, so an upper bound
    # freezes prices and the framework reports stale costs. The floor is the v2
    # pricing-data line; a ceiling here also transitively caps pydantic-ai, since
    # pydantic-ai-slim>=2.22.0 requires genai-prices>=0.1.0.
    "genai-prices>=0.1.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Token-free load-testing mock (akgentic.llm.loadtest). Parses scenario YAML.
loadtest = [
    "pyyaml>=6.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "types-PyYAML>=6.0",
    # Test-only: several test modules import akgentic.core. akgentic-llm itself
    # must not depend on core, so it stays out of [project.dependencies].
    "akgentic-core>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akgentic"]

# Tool configurations inherit from root workspace pyproject.toml
# Only override when package-specific behavior is needed

# Standalone-package CI does not check out the workspace, so the root's pytest
# config is not inherited; asyncio_mode='auto' must be set here or bare async
# tests fail collection (pytest-asyncio defaults to 'strict').
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "ASYNC", "C901", "PLR0912", "PLR0915"]
ignore = ["ANN401", "N802"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50
