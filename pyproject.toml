[project]
name = "akgentic-llm"
version = "2.0.2"
description = "LLM integration layer for Akgentic agent systems"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [
    { name = "gpiroux", email = "geoffroy.piroux@weareyuma.com" }
]
keywords = ["llm", "agents", "ai", "pydantic-ai", "react"]

dependencies = [
    # Ceiling pinned to a reproduced upstream break, NOT a precautionary cap: pydantic-ai 2.32.0
    # switched its HTTP client to httpx2 (github.com/pydantic/httpx2, a fork — not encode's httpx
    # at 2.x), so the provider constructors now want httpx2.AsyncClient while create_http_client()
    # returns httpx.AsyncClient. 2.31.0 is the last httpx release. Lifting this is a workspace
    # decision, not a dependency sweep: the FastAPI/Starlette tier stays on encode httpx, so
    # adoption is permanently dual-stack. See decisions/adr-020 for the lift conditions.
    "pydantic-ai[mistral]>=2,<2.32",
    # NEVER cap this: genai-prices ships the price table itself, so an upper bound
    # freezes prices and the framework reports stale costs. The floor is the v2
    # pricing-data line; a ceiling here also transitively caps pydantic-ai, since
    # pydantic-ai-slim>=2.22.0 requires genai-prices>=0.1.0.
    "genai-prices>=0.1.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Token-free load-testing mock (akgentic.llm.loadtest). Parses scenario YAML.
loadtest = [
    "pyyaml>=6.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "types-PyYAML>=6.0",
    # Test-only: several test modules import akgentic.core. akgentic-llm itself
    # must not depend on core, so it stays out of [project.dependencies].
    "akgentic-core>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akgentic"]

# Tool configurations inherit from root workspace pyproject.toml
# Only override when package-specific behavior is needed

# Standalone-package CI does not check out the workspace, so the root's pytest
# config is not inherited; asyncio_mode='auto' must be set here or bare async
# tests fail collection (pytest-asyncio defaults to 'strict').
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "ASYNC", "C901", "PLR0912", "PLR0915"]
ignore = ["ANN401", "N802"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50
