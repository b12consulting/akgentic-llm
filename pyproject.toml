[project]
name = "akgentic-llm"
version = "2.2.0"
description = "LLM integration layer for Akgentic agent systems"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [
    { name = "gpiroux", email = "geoffroy.piroux@weareyuma.com" }
]
keywords = ["llm", "agents", "ai", "pydantic-ai", "react"]

dependencies = [
    # The LLM tier runs on httpx2 (github.com/pydantic/httpx2). create_http_client() builds an
    # httpx2.AsyncClient on pydantic-ai's AsyncHTTPX2TenacityTransport, and that single client is
    # handed to all six provider builders. A client of the wrong stack is rejected at RUNTIME by
    # the migrated SDKs, not merely by a type checker, so the two stacks must not be mixed here.
    # The web/catalog tier (akgentic-catalog, -infra, -enterprise, -department, and akgentic-tool's
    # MCP OAuth handler) stays on encode's httpx by decision — that is not a leftover.
    # google-genai and mistralai are still on encode's httpx internally and accept an httpx2 client
    # through duck typing, which is why pydantic-ai's AsyncHTTPClient union covers both.
    # See decisions/adr-020. No ceiling on pydantic-ai, anthropic or openai: the ceilings that once
    # blocked the migrated majors were removed with the migration itself. The floor is 2.32 because
    # AsyncHTTPX2TenacityTransport first exists there — below it, providers.py cannot import.
    # This is pydantic-ai-SLIM, not the pydantic-ai metapackage, with exactly the extras this
    # package imports. The metapackage is a convenience bundle for application authors: it adds
    # cli, evals, logfire and web on top of slim, so a library that depends on it drags a CLI, an
    # eval harness and a web framework into every consumer's dependency cone — and web is what
    # pulled starlette in. The extras below are derived from the lazy provider imports in
    # providers.py; openai covers OpenAI, Azure AND NVIDIA, since all three ride the OpenAI SDK,
    # and retries is what makes pydantic_ai.retries importable (that is not the tenacity line
    # below, which is a direct import of ours).
    "pydantic-ai-slim[anthropic,google,mistral,openai,retries]>=2.32,<3",
    # NEVER cap this: genai-prices ships the price table itself, so an upper bound
    # freezes prices and the framework reports stale costs. The floor is the v2
    # pricing-data line; a ceiling here also transitively caps pydantic-ai, since
    # pydantic-ai-slim>=2.22.0 requires genai-prices>=0.1.0.
    "genai-prices>=0.1.0",
    "pydantic>=2.0.0",
    "httpx2>=2.7",
    "tenacity>=8.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Token-free load-testing mock (akgentic.llm.loadtest). Parses scenario YAML.
loadtest = [
    "pyyaml>=6.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "python-dotenv>=1.0.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "types-PyYAML>=6.0",
    # Test-only: several test modules import akgentic.core. akgentic-llm itself
    # must not depend on core, so it stays out of [project.dependencies].
    "akgentic-core>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akgentic"]

# Tool configurations inherit from root workspace pyproject.toml
# Only override when package-specific behavior is needed

# Standalone-package CI does not check out the workspace, so the root's pytest
# config is not inherited; asyncio_mode='auto' must be set here or bare async
# tests fail collection (pytest-asyncio defaults to 'strict').
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "ASYNC", "C901", "PLR0912", "PLR0915"]
ignore = ["ANN401", "N802"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50
